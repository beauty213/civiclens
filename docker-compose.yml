services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: civiclens-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QAI_HUB_API_TOKEN=${QAI_HUB_API_TOKEN:-}
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - civiclens-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        AI_SERVICE_URL: http://ai-service:8000
    container_name: civiclens-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - AI_SERVICE_URL=http://ai-service:8000
    networks:
      - civiclens-network

networks:
  civiclens-network:
    driver: bridge
